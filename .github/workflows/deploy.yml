name: Deploy to Vercel

# Deploys the portal to Vercel on every push to main, or when run by hand
# from the Actions tab. Needs one repository secret: VERCEL_TOKEN
# (create it at https://vercel.com/account/tokens). The first run creates
# the Vercel project "job-search-portal" in that token's account.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check for the Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a repository secret named VERCEL_TOKEN (Settings > Secrets and variables > Actions). Create the token at https://vercel.com/account/tokens."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@39.1.1 deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          echo "### Live at $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the deployed search function
        run: |
          curl -fsS "${{ steps.deploy.outputs.url }}/api/search"
