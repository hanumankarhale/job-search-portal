name: Check live site

# Runs a real job search against the deployed site, to confirm the site and
# every job source work. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site address
        default: https://job-search-portal-alpha.vercel.app
      key:
        description: PORTAL_KEY, if the site has one
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Page loads
        run: |
          code=$(curl -sS -o page.html -w "%{http_code}" "${{ inputs.url }}/")
          echo "::notice title=Page::HTTP $code, $(wc -c < page.html) bytes, title: $(grep -o '<title>[^<]*' page.html | head -1 | cut -c8-)"
          [ "$code" = 200 ]
      - name: Search function answers
        run: |
          code=$(curl -sS -o info.json -w "%{http_code}" "${{ inputs.url }}/api/search")
          echo "::notice title=api/search::HTTP $code $(head -c 300 info.json)"
          [ "$code" = 200 ]
      - name: Real search (Node.js, 4 years, Pune, last 10 days)
        run: |
          curl -sS --max-time 120 -X POST "${{ inputs.url }}/api/search" \
            -H 'Content-Type: application/json' -H "X-Portal-Key: ${{ inputs.key }}" \
            -d '{"profile":{"languages":[{"name":"Node.js"}],"skills":["JavaScript","Express","MongoDB"],"targetRoles":["Node.js Developer"],"locations":["Pune"],"yearsExperience":4,"postedWithinDays":10}}' \
            -o result.json -w "search HTTP %{http_code}\n"
          node -e '
            const r = JSON.parse(require("fs").readFileSync("result.json", "utf8"));
            if (!r.jobs) { console.log(`::error title=Search::${JSON.stringify(r).slice(0, 300)}`); process.exit(1); }
            const note = (title, msg) => console.log(`::notice title=${title}::${msg.replace(/\n/g, "%0A")}`);
            note("Search", `Searched ${r.plan.queries.join(", ")} in ${r.plan.location} within ${r.plan.maxAgeDays} days: ${r.jobs.length} jobs`);
            note("Sources", Object.entries(r.report).map(([k, v]) => `${k}: ${v.ok ? v.count + " jobs" : "FAILED " + v.error}`).join("\n"));
            note("Best matches", r.jobs.slice(0, 10).map((j) => `${j.fit.score} ${j.title} | ${j.company} | ${j.location} | ${j.postedAt ? j.postedAt.slice(0, 10) : "no date"}`).join("\n"));
            if (!Object.values(r.report).some((v) => v.ok)) process.exit(1);
          '
